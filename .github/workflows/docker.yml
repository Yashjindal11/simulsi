name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t simulsi:build .
      - name: Smoke test
        run: docker run --rm simulsi:build run builtin:mmc --duration 300 --seed 1
      - name: Push to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/simulsi"
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          version=$(docker run --rm simulsi:build --version | awk '{print $2}')
          for tag in "$version" latest; do
            docker tag simulsi:build "$image:$tag"
            docker push "$image:$tag"
          done

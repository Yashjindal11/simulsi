name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit, property, statistical and CLI tests
        run: pytest -m "not integration and not slow" --cov --cov-report=term
        env:
          MPLBACKEND: Agg
      - name: Integration tests
        run: pytest -m integration
        env:
          MPLBACKEND: Agg
      - name: Performance guards
        run: pytest -m slow
      - name: Examples run
        run: python scripts/run_examples.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - name: Type check and build dashboard
        run: npm run build

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build dashboard into the package
        run: npm --prefix web/frontend ci && npm --prefix web/frontend run build
      - run: pip install build
      - run: python -m build
      - name: Install wheel in a clean venv and smoke test
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install "$(ls dist/*.whl)"
          cd /tmp
          /tmp/clean/bin/simulsi --version
          /tmp/clean/bin/simulsi run builtin:mmc --duration 500 --seed 1
          /tmp/clean/bin/simulsi init /tmp/proj
          /tmp/clean/bin/simulsi validate /tmp/proj/experiment.yaml
          /tmp/clean/bin/python -c "import simulsi.web.server as s; assert (s.STATIC_DIR / 'index.html').is_file()"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t simulsi:ci .
      - name: Smoke test the CLI
        run: |
          docker run --rm simulsi:ci --version
          docker run --rm simulsi:ci run builtin:mmc --duration 300 --seed 1
      - name: Smoke test the dashboard
        run: |
          docker run -d --name ui -p 127.0.0.1:8642:8642 simulsi:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8642/api/info && break; sleep 1; done
          curl -sf http://localhost:8642/api/info | grep -q builtin:mmc
          curl -sf http://localhost:8642/ | grep -qi "<div id=\"root\">"
          docker rm -f ui

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e . pip-audit
      - name: Dependency audit
        run: pip-audit --skip-editable

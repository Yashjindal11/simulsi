name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build dashboard into the package
        run: npm --prefix web/frontend ci && npm --prefix web/frontend run build
      - run: pip install -e ".[dev]"
      - run: pytest -m "not slow"
        env:
          MPLBACKEND: Agg
      - run: python -m build
      - name: Check version matches tag
        run: |
          v=$(python -c "import simulsi; print(simulsi.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "version $v does not match tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(python scripts/release_notes.py "${GITHUB_REF_NAME#v}")
          gh release create "${GITHUB_REF_NAME}" dist/* --title "SimulSI ${GITHUB_REF_NAME}" --notes "$notes"

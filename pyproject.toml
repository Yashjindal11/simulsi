[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "simulsi"
dynamic = ["version"]
description = "A general-purpose, reproducible simulation and scenario experimentation framework for Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Yash Jindal" }]
keywords = [
    "simulation",
    "discrete-event-simulation",
    "monte-carlo",
    "operations-research",
    "queueing",
    "experiments",
    "sensitivity-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.1"]
parquet = ["pandas>=2.1", "pyarrow>=14"]
viz = ["matplotlib>=3.8"]
plotly = ["plotly>=5.18"]
all = ["pandas>=2.1", "pyarrow>=14", "matplotlib>=3.8", "plotly>=5.18"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff==0.16.10",
    "mypy>=1.10",
    "types-PyYAML",
    "build>=1.2",
    "pandas>=2.1",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "plotly>=5.18",
]

[project.scripts]
simulsi = "simulsi.cli.main:main"

[project.urls]
Homepage = "https://github.com/Yashjindal11/simulsi"
Documentation = "https://github.com/Yashjindal11/simulsi/tree/main/docs"
Issues = "https://github.com/Yashjindal11/simulsi/issues"

[tool.hatch.version]
path = "src/simulsi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/simulsi"]
# Built dashboard assets are git-ignored but must ship in wheels when present.
artifacts = ["src/simulsi/web/static/**"]

[tool.hatch.build.targets.sdist]
include = ["src/simulsi", "tests", "docs", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]
artifacts = ["src/simulsi/web/static/**"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["web"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = [
    "E501",   # line length is handled by ruff format
    "S101",   # assert is used for internal invariants and tests
    "S311",   # simulation randomness is not cryptographic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"examples/**" = ["S"]
"benchmarks/**" = ["S"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["simulsi"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy.*", "pandas.*", "pyarrow.*", "matplotlib.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that exercise several subsystems end to end",
    "statistical: tests that check simulated output against theory",
    "slow: long-running tests",
]

[tool.coverage.run]
source = ["simulsi"]
branch = true
